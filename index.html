<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>یه سوال مهم ❤️</title>
<style>
body{
font-family:tahoma;
background:#ffd6e7;
text-align:center;
margin-top:100px;
}
button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:15px;
margin:20px;
}
#yes{background:green;color:white;}
#no{background:red;color:white;position:absolute;}
</style>
</head>

<body>

<h1>❤️ با من میای بیرون؟ ❤️</h1>

<button id="yes" onclick="ok()">آره 😍</button>
<button id="no">نه 🙈</button>

<script>
let no=document.getElementById("no");

no.onmouseover=function(){
no.style.left=Math.random()*80+"%";
no.style.top=Math.random()*80+"%";
}

function ok(){
document.body.innerHTML="<h1>🥰 پس قرارمون شد ❤️</h1>";
}
</script>

</body>
</html>
