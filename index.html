<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>قرار ما ❤️</title>

<style>
body{
font-family:tahoma;
background:linear-gradient(#ffd1e8,#fff);
text-align:center;
padding-top:60px;
}

.card{
background:white;
width:85%;
margin:auto;
padding:25px;
border-radius:25px;
box-shadow:0 0 20px #aaa;
}

h1{
color:#e91e63;
}

button{
background:#e91e63;
color:white;
border:0;
padding:15px 30px;
border-radius:20px;
font-size:18px;
}

.heart{
font-size:50px;
animation:beat 1s infinite;
}

@keyframes beat{
50%{transform:scale(1.3);}
}
</style>

</head>

<body>

<div class="card">

<div class="heart">❤️</div>

<h1>زهرای من </h1>

<h2>یه قرار قشنگ با هم؟ 🥰</h2>

<p>
📅 تاریخ قرار:
<br>
  هروقت تو بگی عشقمم زهرا جوووونم
</p>

<p>
👔 من:
<br>
پیراهن سفید + شلوار مشکی
</p>

<p>
👗 تو:
<br>
هر لباسی که باهاش احساس زیبایی و راحتی می‌کنی ❤️
</p>

<p>
"کنار تو حتی یک روز معمولی هم تبدیل به بهترین خاطره میشه."
</p>

<button onclick="yes()">
قبول کردم 😍
</button>

</div>

<script>
function yes(){
document.body.innerHTML=
"<h1 style='margin-top:150px'>پس هروقت مامان بابات رفتن بیا بریم بیرون توروخدا 😭 ❤️<br>منتظرم</h1>";
}
</script>

</body>
</html>
